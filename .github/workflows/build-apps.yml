name: Build PC Software (.exe) and Android App (.apk)

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "desktop/**"
      - ".github/workflows/build-apps.yml"
  workflow_dispatch:

jobs:
  # =========================================================
  # JOB 1: BUILD WINDOWS PC APPLICATION (.EXE)
  # =========================================================
  build-windows:
    name: 🖥️ Build Windows PC Software (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Build Frontend Production Assets
        working-directory: ./frontend
        env:
          CI: false
        run: npm run build

      - name: Copy Frontend Build to Desktop Folder
        run: |
          New-Item -ItemType Directory -Force -Path desktop/build
          Copy-Item -Recurse -Force frontend/build/* desktop/build/

      - name: Install Desktop Dependencies
        working-directory: ./desktop
        run: npm install

      - name: Package Windows Executables (.exe)
        working-directory: ./desktop
        run: npx @electron/packager . Dukaan --platform=win32 --arch=x64 --icon=icon.ico --out=dist --overwrite

      - name: Compress Windows Executable Package
        run: |
          Compress-Archive -Path desktop/dist/Dukaan-win32-x64/* -DestinationPath desktop/dist/Dukaan-Windows-PC.zip -Force

      - name: Upload Windows .exe Package
        uses: actions/upload-artifact@v4
        with:
          name: Dukaan-Windows-PC-Software
          path: desktop/dist/Dukaan-Windows-PC.zip
          retention-days: 30

  # =========================================================
  # JOB 2: BUILD ANDROID APPLICATION (.APK)
  # =========================================================
  build-android:
    name: 📱 Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Build Frontend Production Assets
        working-directory: ./frontend
        env:
          CI: false
        run: npm run build

      - name: Install Capacitor & Generate Android Native Project
        working-directory: ./frontend
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: ./frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename and Prepare APK
        working-directory: ./frontend/android/app/build/outputs/apk/debug
        run: |
          cp app-debug.apk Dukaan.apk

      - name: Upload Android .apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dukaan-Android-App-APK
          path: ./frontend/android/app/build/outputs/apk/debug/Dukaan.apk
          retention-days: 30
